name: CT contract
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
concurrency:
  group: ct-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  contract:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-contract' || 'contract' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # budget: 5 minutes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync python tools/contract_lint.py
      - run: uv run --no-sync pytest -v tests/test_contract_lint.py tests/test_contract.py tests/test_contract_header.py tests/test_contract_schema_types.py tests/test_contract_bundle.py tests/test_contract_validation.py
      - run: uv run --no-sync python -m tools.publish_contract_schema --write
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-schema-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs/contract/header.schema.json
          if-no-files-found: error
      - name: Verify schema against the actual baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            uv run --no-sync python -m tools.publish_contract_schema --base "$BASE"
          else
            uv run --no-sync python -m tools.publish_contract_schema
          fi
      - run: git ls-files --error-unmatch docs/contract/header.schema.json
      - run: git diff --exit-code -- docs/contract/header.schema.json
