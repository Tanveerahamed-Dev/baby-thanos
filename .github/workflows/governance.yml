name: Governance foundation
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '32 22 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: governance-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  governance-foundation:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-governance-foundation' || 'governance-foundation' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # budget: 5 minutes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q tests/test_governance.py tests/test_main_receipts.py
      - name: Enforce size and ADR guards; emit review diff digest
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-parse HEAD^1)
          fi
          uv run --no-sync python -m tools.governance --base "$BASE" --head HEAD
      - name: Require native receipts for the exact event base
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            BASE=$(git rev-parse HEAD)
          elif [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-parse HEAD^1)
          fi
          uv run --no-sync python -m tools.base_native_receipts --base "$BASE" --event "$EVENT"
