name: P0 runner evidence
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  p0-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - name: Temporary exact-head P3 decoder profile
        env:
          P3_PROFILE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import cProfile
          import json
          import os
          import pstats
          import subprocess
          from hashlib import sha256
          from atlas_brain.contract.canonical import canonical
          from atlas_brain.evidence.p3_admission import admit_members
          from atlas_brain.runner.p3 import analyse_group
          from atlas_brain.runner.p3_manifest import validate
          from tools.p3_cases import members
          reviewed = os.environ['P3_PROFILE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and actual == reviewed and len(reviewed) == 40
          files = members(canonical, 'supported')
          payload, _ = analyse_group(admit_members(files))
          entries = sorted(({'capture': c['id'], 'sha256': c['sha256']} for c in payload['captures']), key=lambda c: c['capture'])
          pins = {key: payload[key] for key in ('registry_sha256', 'base_registry_sha256')}
          digest = sha256(canonical({'captures': entries, **pins})).hexdigest()
          evidence = {**pins, 'digest': digest, 'files': len(files), 'captures': len(entries)}
          print('P3_PROFILE_SUBJECT ' + json.dumps({'head': reviewed, 'case': 'supported', 'captures': len(entries), 'input_digest': digest, 'scope': 'diagnostic_only'}, sort_keys=True), flush=True)
          profile = cProfile.Profile()
          profile.runcall(validate, payload, evidence)
          pstats.Stats(profile).strip_dirs().sort_stats('cumulative').print_stats(35)
          print('P3_PROFILE_END ' + reviewed, flush=True)
          PY
      - run: uv run --no-sync pytest -q -rs tests/runner
      - name: Compare repeated demo bytes and retain evidence
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import subprocess
          import sys
          from hashlib import sha256
          from pathlib import Path
          root = Path(".ci-evidence/p0-demo")
          evidence = root / "captures"
          evidence.mkdir(parents=True)
          raw = (b"sw-a uptime is 1 day, 2 hours, 3 minutes\n"
                 b'System image file is "bootflash:packages.conf"\n'
                 b"Last reload reason: PowerOn\n")
          (evidence / "show-version.txt").write_bytes(raw)
          outputs = []
          for index, workers in enumerate((1, 4, 4)):
              out = root / f"out-{index}"
              subprocess.run([sys.executable, "-m", "atlas_brain.runner",
                              "--evidence", str(evidence), "--out", str(out),
                              "--workers", str(workers)], check=True)
              outputs.append({name: (out / name).read_bytes()
                              for name in ("SUMMARY.txt", "MANIFEST.json")})
          assert outputs[0] == outputs[1] == outputs[2]
          assert (evidence / "show-version.txt").read_bytes() == raw
          digests = {name: sha256(raw).hexdigest() for name, raw in outputs[0].items()}
          receipt = json.dumps(digests, sort_keys=True) + "\n"
          (root / "DIGESTS.json").write_text(receipt, encoding="ascii", newline="\n")
          print(outputs[0]["SUMMARY.txt"].decode("ascii"))
          print("P0_DIGESTS " + receipt, end="")
          PY
      - name: Demonstrate P1 interface findings and unknowns
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import subprocess
          import sys
          from hashlib import sha256
          from pathlib import Path
          root = Path(".ci-evidence/p0-demo/p1")
          evidence = root / "captures"
          evidence.mkdir(parents=True)
          samples = {
              "interfaces.txt": b"sw-a#show interfaces\nGi1/0/5 is up, line protocol is down\nsw-a#\n",
              "brief.txt": (b"sw-a#show ip interface brief\nInterface IP-Address OK? Method Status Protocol\n"
                            b"Gi1/0/6 unassigned YES unset up\nsw-a#\n"),
          }
          for name, raw in samples.items():
              (evidence / name).write_bytes(raw)
          outputs = []
          for index, workers in enumerate((1, 4, 4)):
              out = root / f"out-{index}"
              subprocess.run([sys.executable, "-m", "atlas_brain.runner", "--evidence", str(evidence),
                              "--out", str(out), "--workers", str(workers)], check=True)
              outputs.append({name: (out / name).read_bytes() for name in ("SUMMARY.txt", "MANIFEST.json")})
          assert outputs[0] == outputs[1] == outputs[2]
          assert all((evidence / name).read_bytes() == raw for name, raw in samples.items())
          rows = [row for result in json.loads(outputs[0]["MANIFEST.json"])["facts"].values()
                  for row in result["interfaces"]]
          assert any(row["name"]["value"] == "Gi1/0/5" and row["check"]["state"] == "problem" for row in rows)
          assert any(row["name"]["value"] == "Gi1/0/6" and row["check"]["state"] == "unknown"
                     and row["check"]["next_evidence"] for row in rows)
          print(outputs[0]["SUMMARY.txt"].decode("ascii"))
          print("P1_DIGESTS " + json.dumps({name: sha256(raw).hexdigest() for name, raw in outputs[0].items()}, sort_keys=True))
          PY
      - name: Demonstrate declared synthetic P2 mismatch with both ends cited
        run: uv run --no-sync python -m tools.p2_demo
      - name: Demonstrate configured P2 intent with direct and inherited statements
        run: uv run --no-sync python -m tools.p2_config_demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p0-demo-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-evidence/p0-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
