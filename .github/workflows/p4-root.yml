name: Root observation evidence
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  root-observations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - name: Retain fixed Root reports and real CLI witnesses
        env:
          P4_ROOT_REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --no-sync python -m tools.p4_root_demo
      - name: Retain evidence even on refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-root-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .ci-evidence/p4-root
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
